name: MobFlow Stage 3 validation

on:
  pull_request:
    branches:
      - fix/realtime-reconnect-backoff
    paths:
      - "src/lib/**"
      - "src/routes/api/mobflow/**"
      - "src/test/**"
      - "package.json"
      - "bun.lock"
      - "vitest.config.ts"
      - ".github/workflows/mobflow-stage3-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run automated tests
        run: bun run test
      - name: Build application
        run: bun run build
