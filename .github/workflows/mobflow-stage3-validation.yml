name: MobFlow Stage 3 validation

on:
  pull_request:
    branches:
      - fix/realtime-reconnect-backoff
    paths:
      - "src/lib/**"
      - "src/routes/api/mobflow/**"
      - "src/test/**"
      - "package.json"
      - "bun.lock"
      - "vitest.config.ts"
      - ".github/workflows/mobflow-stage3-validation.yml"

permissions:
  contents: read

jobs:
  full-suite:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run complete Vitest suite
        run: bun run test

  focused-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run optimization regression tests
        run: >-
          bunx vitest run
          src/lib/cash-sync.test.ts
          src/test/realtime-reconnect.test.ts
          src/test/stock-movement-changes-api.test.ts
          src/test/sync-outbox.test.ts
          src/lib/sync-event-apply.test.ts

  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build application
        run: bun run build
