name: Migration Preview validation
on:
  push:
    branches: [migration/neon-preparation]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Catalog and incremental sync API tests
        run: bun run test -- src/test/mobflow-products-api.test.ts src/test/mobflow-sync-events-api.test.ts
      - name: TypeScript validation
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
