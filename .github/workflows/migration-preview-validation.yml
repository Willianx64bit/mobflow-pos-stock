name: Migration Preview validation
on:
  push:
    branches: [migration/neon-preparation]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Catalog, sales, cash, stock and incremental sync API tests
        run: bun run test -- src/test/mobflow-products-api.test.ts src/test/mobflow-sales-command.test.ts src/test/mobflow-cash-command.test.ts src/test/mobflow-stock-command.test.ts src/test/mobflow-sync-events-api.test.ts
      - name: Production build
        run: bun run build
      - name: TypeScript validation (non-blocking migration debt)
        run: bunx tsc --noEmit
        continue-on-error: true
