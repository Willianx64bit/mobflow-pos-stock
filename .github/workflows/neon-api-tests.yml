name: Neon API tests

on:
  push:
    branches:
      - migration/neon-preparation
    paths:
      - "src/lib/**"
      - "src/routes/api/mobflow/**"
      - "src/routes/api/auth/**"
      - "src/routes/__root.tsx"
      - "src/components/**"
      - "src/test/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "vitest.config.ts"
      - ".github/workflows/neon-api-tests.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies and synchronize lockfile
        run: |
          bun install
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore(deps): synchronize Bun lockfile"
            git push
          fi
      - name: Validate migration utility syntax
        run: node --check scripts/migrate-supabase-auth-to-better-auth.mjs
      - name: Run unit tests
        run: bun run test
      - name: Build application
        run: bun run build
