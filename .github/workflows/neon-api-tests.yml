name: Neon API tests

on:
  push:
    branches:
      - migration/neon-preparation
    paths:
      - "src/lib/server/**"
      - "src/routes/api/mobflow/**"
      - "src/test/**"
      - "package.json"
      - "bun.lock"
      - "vitest.config.ts"
      - ".github/workflows/neon-api-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests
        run: bun run test
      - name: Build application
        run: bun run build
