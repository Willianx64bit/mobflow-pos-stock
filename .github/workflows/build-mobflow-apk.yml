name: Build MobFlow Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - packaging/android-apk-wrapper
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-mobflow-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-wrapper
    steps:
      - name: Checkout isolated wrapper branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-wrapper/package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install wrapper dependencies
        run: npm install

      - name: Prepare MobFlow MF icon
        run: |
          mkdir -p resources
          node scripts/prepare-icon.mjs

      - name: Generate Android project
        run: npx cap add android

      - name: Generate Android launcher icons
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android-wrapper/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobflow-android-apk
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
