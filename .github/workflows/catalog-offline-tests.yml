name: Offline catalog regression

on:
  push:
    branches:
      - desktop/catalog-offline-scale
    paths:
      - "src/lib/product-catalog.ts"
      - "src/lib/store.ts"
      - "src/test/product-catalog.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/catalog-offline-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobflow-offline-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog-tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Test atomic offline catalog
        run: npm test -- src/test/product-catalog.test.ts
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Build application bundle
        run: npm run build
