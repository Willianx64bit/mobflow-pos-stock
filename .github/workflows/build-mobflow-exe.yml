name: Build MobFlow Windows EXE
# Rebuild requested after desktop outbox/reconnection fixes.

on:
  workflow_dispatch:
  push:
    branches:
      - packaging/windows-exe-neon
      - desktop/local-runtime-foundation
      - desktop/exe-three-realtime-optimizations
    paths:
      - "desktop-wrapper/**"
      - "src/routes/__root.tsx"
      - "src/routes/index.tsx"
      - "src/routes/analise-resultados.tsx"
      - "src/routes/transferencias.tsx"
      - "src/routes/baixa-produtos.tsx"
      - "src/components/LoginScreen.tsx"
      - "src/components/AppHeader.tsx"
      - "src/lib/store.ts"
      - "src/lib/sync-outbox.ts"
      - "src/routes/api/mobflow/receivables.ts"
      - "src/routes/api/mobflow/state.ts"
      - "src/routes/fiado.tsx"
      - "src/routes/fiado.$customer.tsx"
      - "src/routes/fiado.cliente.tsx"
      - "src/lib/fiado-password.ts"
      - "src/lib/offline-fiado-auth.ts"
      - "desktop-wrapper/test/offline-session.test.cjs"
      - "src/test/offline-fiado-auth.test.ts"
      - "src/test/offline-preparation.test.ts"
      - "src/test/pix-offline-payload.test.ts"
      - "src/test/sync-outbox.test.ts"
      - "src/test/mobflow-receivables-command.test.ts"
      - "public/mobflow-desktop-sw.js"
      - "public/mobflow-icon.svg"
      - ".github/workflows/build-mobflow-exe.yml"

permissions:
  contents: read

concurrency:
  group: mobflow-desktop-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-wrapper
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-wrapper/package.json

      - name: Instalar dependências do aplicativo MobFlow
        working-directory: ${{ github.workspace }}
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Gerar build local do aplicativo MobFlow para Electron
        working-directory: ${{ github.workspace }}
        env:
          MOBFLOW_DESKTOP_BUILD: "1"
          # Public Realtime endpoint configured for the isolated Neon Preview branch.
          VITE_NEON_REALTIME_URL: "https://ep-tiny-band-bd5bkjdc.rt.c-8.us-east-2.aws.neon.tech/"
          # This EXE targets the isolated Neon Preview branch whose relational
          # bootstrap is enabled and whose incremental event contracts are tested.
          VITE_MOBFLOW_INCREMENTAL_SYNC: "true"
          VITE_MOBFLOW_INCREMENTAL_BOOTSTRAP_READY: "true"
          VITE_MOBFLOW_CATALOG_READ_PROVIDER: "neon"
        run: npm run build

      - name: Verificar shell local do MobFlow
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $shell = Join-Path $env:GITHUB_WORKSPACE ".output/public/_shell.html"
          if (-not (Test-Path $shell)) { throw "Shell SPA local não foi gerado em .output/public/_shell.html." }
          if ((Get-Item $shell).Length -lt 500) { throw "Shell local está vazio ou incompleto." }

      - name: Testar fila offline e transações Neon
        working-directory: ${{ github.workspace }}
        run: npm test -- src/test/sync-outbox.test.ts src/test/mobflow-bidirectional-sync.test.ts src/lib/sync-event-apply.test.ts src/test/mobflow-sales-command.test.ts src/test/mobflow-cash-command.test.ts src/test/mobflow-stock-command.test.ts src/test/mobflow-receivables-command.test.ts src/test/offline-fiado-auth.test.ts src/test/offline-preparation.test.ts src/test/pix-offline-payload.test.ts src/test/stock-movement-changes-api.test.ts src/test/realtime-reconnect.test.ts src/lib/cash-sync.test.ts

      - name: Instalar dependências do empacotador Windows
        run: npm install

      - name: Testar validação da sessão offline
        run: npm test

      - name: Gerar instalador Windows
        run: npm run dist

      - name: Verificar instalador
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Instalador EXE não encontrado." }
          Write-Host "Instalador gerado: $($installer.Name)"
          if ($installer.Length -lt 10MB) { throw "Instalador inesperadamente pequeno." }

      - name: Testar instalação e inicialização local sem internet
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/*.exe" | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait
          $app = Join-Path $env:LOCALAPPDATA "Programs/MobFlow/MobFlow.exe"
          if (-not (Test-Path $app)) {
            $app = Get-ChildItem "$env:LOCALAPPDATA/Programs" -Filter "MobFlow.exe" -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $app -or -not (Test-Path $app)) { throw "MobFlow.exe não foi encontrado após a instalação." }
          $resources = Join-Path (Split-Path $app) "resources"
          $shell = Join-Path $resources "mobflow-web/_shell.html"
          $appArchive = Join-Path $resources "app.asar"
          if (-not (Test-Path $shell)) { throw "O instalador não contém o shell local do MobFlow." }
          if (-not (Test-Path $appArchive)) { throw "O instalador não contém o pacote Electron com o servidor local." }

          $readyFile = Join-Path $env:TEMP "mobflow-local-runtime-ready-$PID.json"
          Remove-Item $readyFile -Force -ErrorAction SilentlyContinue
          $env:MOBFLOW_TEST_OFFLINE = "1"
          $env:MOBFLOW_TEST_READY_FILE = $readyFile
          $process = Start-Process -FilePath $app -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            while (-not (Test-Path $readyFile) -and (Get-Date) -lt $deadline) {
              $process.Refresh()
              if ($process.HasExited) { throw "MobFlow encerrou durante a inicialização offline. ExitCode: $($process.ExitCode)" }
              Start-Sleep -Milliseconds 500
            }
            if (-not (Test-Path $readyFile)) { throw "O runtime local não iniciou em 30 segundos sem internet." }
            $runtime = Get-Content $readyFile -Raw | ConvertFrom-Json
            $homeResponse = Invoke-WebRequest -Uri $runtime.url -TimeoutSec 10
            if ($homeResponse.StatusCode -ne 200 -or $homeResponse.Content.Length -lt 500) { throw "O shell local não foi servido corretamente." }
            $deepRoute = Invoke-WebRequest -Uri ($runtime.url + "operacoes/baixa-produtos") -TimeoutSec 10
            if ($deepRoute.StatusCode -ne 200 -or $deepRoute.Content -ne $homeResponse.Content) { throw "A rota profunda não retornou o shell local." }
            $process.Refresh()
            if ($process.HasExited) { throw "MobFlow encerrou inesperadamente durante o primeiro início offline." }
            $firstPort = ([uri]$runtime.url).Port
            Stop-Process -Id $process.Id -Force
            $process.WaitForExit()
            Remove-Item $readyFile -Force -ErrorAction SilentlyContinue

            # Reopen a completely new Electron process while the API proxy remains offline.
            $process2 = Start-Process -FilePath $app -PassThru
            $deadline = (Get-Date).AddSeconds(30)
            while (-not (Test-Path $readyFile) -and (Get-Date) -lt $deadline) {
              $process2.Refresh()
              if ($process2.HasExited) { throw "MobFlow encerrou durante a reabertura offline." }
              Start-Sleep -Milliseconds 500
            }
            if (-not (Test-Path $readyFile)) { throw "O runtime local não reiniciou em 30 segundos." }
            $runtime2 = Get-Content $readyFile -Raw | ConvertFrom-Json
            if (([uri]$runtime2.url).Port -ne $firstPort) { throw "A porta local mudou após reiniciar; os dados locais não seriam persistentes." }
            $reopened = Invoke-WebRequest -Uri $runtime2.url -TimeoutSec 10
            if ($reopened.StatusCode -ne 200 -or $reopened.Content.Length -lt 500) { throw "O shell local não foi servido após a reabertura." }
            $process2.Refresh()
            if ($process2.HasExited) { throw "MobFlow encerrou inesperadamente após a reabertura offline." }
            Write-Host "Aprovado: dois processos Electron iniciaram em sequência sem internet e mantiveram a mesma origem local."
          } finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            if ($process2 -and -not $process2.HasExited) { Stop-Process -Id $process2.Id -Force }
            Remove-Item $readyFile -Force -ErrorAction SilentlyContinue
            Remove-Item Env:MOBFLOW_TEST_OFFLINE -ErrorAction SilentlyContinue
            Remove-Item Env:MOBFLOW_TEST_READY_FILE -ErrorAction SilentlyContinue
          }

      - name: Publicar instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: mobflow-windows-exe
          path: desktop-wrapper/dist/*.exe
          if-no-files-found: error
          retention-days: 30
